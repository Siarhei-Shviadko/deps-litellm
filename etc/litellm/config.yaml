model_list:
  # AWS Models
  - model_name: bedrock/claude-sonnet-4-6
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-4-6
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: bedrock/claude-sonnet-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: bedrock/nova-pro-v1
    litellm_params:
      model: bedrock/us.amazon.nova-pro-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  # Google Models
  - model_name: gemini/gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini/gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini/gemini-flash-latest
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini/gemini-pro-latest
    litellm_params:
      model: gemini/gemini-pro-latest
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini/gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY

  # DIAL Models
  - model_name: dial/gpt-4o
    litellm_params:
      model: azure/gpt-4o
      api_base: os.environ/DIAL_API_BASE
      api_key: os.environ/DIAL_API_KEY
      base_model: gpt-4o
      default_headers:
        Api-Key: os.environ/DIAL_API_KEY
  
  - model_name: dial/gpt-4.1-mini
    litellm_params:
      model: azure/gpt-4.1-mini-2025-04-14
      api_base: os.environ/DIAL_API_BASE
      api_key: os.environ/DIAL_API_KEY
      base_model: gpt-4.1-mini
      default_headers:
        Api-Key: os.environ/DIAL_API_KEY

  - model_name: dial/claude-haiku-4-5
    litellm_params:
      model: azure/anthropic.claude-haiku-4-5-20251001-v1:0
      api_base: os.environ/DIAL_API_BASE
      api_key: os.environ/DIAL_API_KEY
      base_model: claude-haiku-4-5
      default_headers:
        Api-Key: os.environ/DIAL_API_KEY

  - model_name: dial/claude-sonnet-4-5
    litellm_params:
      model: azure/anthropic.claude-sonnet-4-5-20250929-v1:0
      api_base: os.environ/DIAL_API_BASE
      api_key: os.environ/DIAL_API_KEY
      base_model: claude-sonnet-4-5
      default_headers:
        Api-Key: os.environ/DIAL_API_KEY

  - model_name: dial/gpt-5-mini
    litellm_params:
      model: azure/gpt-5-mini-2025-08-07
      api_base: os.environ/DIAL_API_BASE
      api_key: os.environ/DIAL_API_KEY
      base_model: gpt-5-mini
      drop_params: true
      default_headers:
        Api-Key: os.environ/DIAL_API_KEY

  - model_name: dial/rag
    litellm_params:
      model: azure/dial-rag
      api_base: os.environ/DIAL_API_BASE
      api_key: os.environ/DIAL_API_KEY
      drop_params: true
      default_headers:
        Api-Key: os.environ/DIAL_API_KEY

  - model_name: dial/claude-sonnet-4-6
    litellm_params:
      model: azure/anthropic.claude-sonnet-4-6
      api_base: os.environ/DIAL_API_BASE
      api_key: os.environ/DIAL_API_KEY
      base_model: claude-sonnet-4-6
      default_headers:
        Api-Key: os.environ/DIAL_API_KEY

  - model_name: deepseek/deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_base: os.environ/DEEPSEEK_API_BASE
      api_key: os.environ/DEEPSEEK_API_KEY
      default_headers:
        Authorization: Bearer os.environ/DEEPSEEK_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
